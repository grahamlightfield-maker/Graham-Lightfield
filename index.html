<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Shortlist</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..800&family=Source+Serif+4:opsz,wght@8..60,400..700&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme: light;
  --bg:#F3F4F1; --surface:#FFFFFF; --surface-2:#F7F8F5; --surface-3:#EEF0EB;
  --line:#E1E4DE; --line-strong:#C8CEC4;
  --ink:#14212B; --ink-2:#4A5863; --ink-3:#7B8791;
  --nav:#14212B; --nav-2:#1D2D38; --nav-ink:#D9E1E6; --nav-ink-2:#93A3AE;
  --brand:#800000; --brand-ink:#800000; --brand-wash:#F6E7E5; --on-brand:#FFFFFF;
  --gold:#B8860B; --gold-wash:#F7EDCF; --gold-ink:#6E5000;
  --sage:#3F7D5A; --sage-wash:#E2EFE7; --sage-ink:#245238;
  --sky:#3B6E8F; --sky-wash:#E1ECF3;
  --warn-ink:#8A5A00; --warn-wash:#FBEFD0;
  --shadow:0 1px 2px rgba(20,33,43,.06),0 8px 24px rgba(20,33,43,.06);
  --focus:#800000;
  --font-ui:"Archivo","Helvetica Neue","Segoe UI",Roboto,Arial,sans-serif;
  --font-doc:"Source Serif 4","Charter","Iowan Old Style",Cambria,Georgia,serif;
}
@media (prefers-color-scheme: dark){
  :root{
    color-scheme: dark;
    --bg:#0E151B; --surface:#131C23; --surface-2:#17222A; --surface-3:#1C2933;
    --line:#22313B; --line-strong:#33454F;
    --ink:#E6ECEF; --ink-2:#A8B5BE; --ink-3:#7D8B95;
    --nav:#0A1015; --nav-2:#15212A; --nav-ink:#DCE4E9; --nav-ink-2:#8494A0;
    --brand:#E3868A; --brand-ink:#F0A7A9; --brand-wash:#3A1C1E; --on-brand:#1A0B0C;
    --gold:#E2B65A; --gold-wash:#3A3016; --gold-ink:#F1D592;
    --sage:#7CC59B; --sage-wash:#183126; --sage-ink:#A9E0C0;
    --sky:#7FB2D3; --sky-wash:#162A38;
    --warn-ink:#F1C866; --warn-wash:#3A3015;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25);
    --focus:#F0A7A9;
  }
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--font-ui);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums}
a{color:var(--brand-ink)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.sr{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ---------- Shell ---------- */
.shell{display:grid;grid-template-columns:252px minmax(0,1fr);min-height:100vh}
.side{background:var(--nav);color:var(--nav-ink);position:sticky;top:0;height:100vh;display:flex;flex-direction:column;padding:18px 12px}
.logo{display:flex;align-items:center;gap:10px;padding:4px 8px 18px}
.mark{width:34px;height:34px;border-radius:8px;background:var(--brand);color:var(--on-brand);display:grid;place-items:center;font:800 15px/1 var(--font-ui);font-stretch:85%;letter-spacing:.02em}
.logo-name{font:700 16px/1.1 var(--font-ui);color:var(--nav-ink)}
.logo-sub{font-size:12.5px;color:var(--nav-ink-2);margin-top:2px}
.nav{display:flex;flex-direction:column;gap:2px}
.nav-btn{display:flex;align-items:center;gap:11px;width:100%;padding:9px 10px;border:0;border-radius:8px;background:transparent;color:var(--nav-ink-2);font:600 14.5px/1.2 var(--font-ui);text-align:left;cursor:pointer}
.nav-btn svg{width:18px;height:18px;flex:0 0 18px}
.nav-btn:hover{background:var(--nav-2);color:var(--nav-ink)}
.nav-btn[aria-current="page"]{background:var(--nav-2);color:var(--nav-ink);box-shadow:inset 3px 0 0 var(--brand)}
.nav-btn .badge{margin-left:auto;font-size:12px;font-weight:700;background:var(--nav-2);color:var(--nav-ink);padding:2px 7px;border-radius:999px}
.nav-btn[aria-current="page"] .badge{background:var(--brand);color:var(--on-brand)}
.side-foot{margin-top:auto;padding:12px 8px 0;border-top:1px solid var(--nav-2)}
.qmini{font-size:12.5px;color:var(--nav-ink-2);margin-bottom:10px}
.qmini b{color:var(--nav-ink)}
.qbar{height:4px;background:var(--nav-2);border-radius:2px;overflow:hidden;margin-top:6px}
.qbar span{display:block;height:100%;background:var(--gold);width:0;transition:width .3s}
.mode{font-size:12.5px;color:var(--nav-ink-2);display:flex;align-items:center;gap:7px}
.dot{width:7px;height:7px;border-radius:50%;background:var(--sage);flex:0 0 7px}
.dot.off{background:var(--gold)}

.main{min-width:0;padding:26px clamp(18px,3.2vw,44px) 90px}
.page-head{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px 20px;margin-bottom:20px}
.page-title{font:700 30px/1.1 var(--font-ui);font-stretch:92%;letter-spacing:-.005em;margin:0}
.page-sub{color:var(--ink-2);margin:6px 0 0;max-width:68ch}
.head-actions{display:flex;flex-wrap:wrap;gap:8px}

/* ---------- Controls ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:8px 13px;border:1px solid var(--line-strong);border-radius:8px;background:var(--surface);color:var(--ink);font:600 14px/1.15 var(--font-ui);cursor:pointer;text-decoration:none;white-space:nowrap}
.btn:hover{border-color:var(--ink-3)}
.btn svg{width:16px;height:16px}
.btn.primary{background:var(--brand);border-color:var(--brand);color:var(--on-brand)}
.btn.primary:hover{filter:brightness(1.07)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--ink-2)}
.btn.ghost:hover{background:var(--surface-3);color:var(--ink)}
.btn.sm{padding:6px 10px;font-size:13px;border-radius:7px}
.btn[disabled]{opacity:.55;cursor:progress}
input[type=text],input[type=email],input[type=password],input[type=url],input[type=date],input[type=search],select,textarea{width:100%;padding:9px 11px;border:1px solid var(--line-strong);border-radius:9px;background:var(--surface);color:var(--ink);font:14.5px/1.45 var(--font-ui)}
textarea{resize:vertical;min-height:90px}
textarea.doc,input.doc{font:16px/1.62 var(--font-doc)}
::placeholder{color:var(--ink-3)}
label.lbl{display:block;font:650 13.5px/1.2 var(--font-ui);margin:0 0 6px;color:var(--ink)}
.hint{font-size:13px;color:var(--ink-2);margin:-2px 0 7px}
.field{margin:0 0 14px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.toggle{display:inline-flex;align-items:center;gap:8px;font-size:14px;cursor:pointer}
.toggle input{width:16px;height:16px;accent-color:var(--brand)}

/* ---------- Surfaces ---------- */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px 20px}
.panel + .panel{margin-top:16px}
.cols > .panel,.cols3 > .panel,.add-grid > .panel{margin-top:0}
.panel-h{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin:0 0 12px}
.panel-h h2,.panel-h h3{font:700 16.5px/1.2 var(--font-ui);margin:0}
.panel-h .meta{font-size:13px;color:var(--ink-3)}
.cols{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.cols3{display:grid;grid-template-columns:2fr 1fr;gap:16px}
.stack > * + *{margin-top:16px}
.muted{color:var(--ink-2)}
.small{font-size:13px}
.empty{padding:28px 24px;text-align:left;border:1px dashed var(--line-strong);border-radius:14px;background:var(--surface-2)}
.empty h3{font:700 17px/1.2 var(--font-ui);margin:0 0 6px}
.empty p{margin:0 0 12px;color:var(--ink-2);max-width:60ch}

/* KPI strip */
.kpis{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px;margin-bottom:16px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.kpi .v{font:700 30px/1 var(--font-ui);font-stretch:80%;letter-spacing:-.01em}
.kpi .l{font-size:13px;color:var(--ink-2);margin-top:6px}

/* Chips */
.chip{display:inline-flex;align-items:center;gap:6px;font:650 12.5px/1 var(--font-ui);padding:5px 9px;border-radius:999px;background:var(--surface-3);color:var(--ink-2);white-space:nowrap}
.chip.ok{background:var(--sage-wash);color:var(--sage-ink)}
.chip.warn{background:var(--warn-wash);color:var(--warn-ink)}
.chip.bad{background:var(--brand-wash);color:var(--brand-ink)}
.chip.info{background:var(--sky-wash);color:var(--sky)}
.chip.gold{background:var(--gold-wash);color:var(--gold-ink)}

/* ---------- Tables ---------- */
.table{width:100%;border-collapse:separate;border-spacing:0;background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.table th{text-align:left;font:650 12.5px/1.2 var(--font-ui);color:var(--ink-2);padding:11px 14px;background:var(--surface-2);border-bottom:1px solid var(--line)}
.table td{padding:12px 14px;border-bottom:1px solid var(--line);vertical-align:middle}
.table tr:last-child td{border-bottom:0}
.table tbody tr{cursor:pointer}
.table tbody tr:hover td{background:var(--surface-2)}
.co{display:flex;align-items:center;gap:11px;min-width:0}
.mono{width:34px;height:34px;border-radius:9px;display:grid;place-items:center;font:800 14px/1 var(--font-ui);font-stretch:85%;color:#fff;flex:0 0 34px}
.co-name{font-weight:700}
.co-role{font-size:13px;color:var(--ink-2)}
.minibar{width:70px;height:6px;border-radius:3px;background:var(--surface-3);overflow:hidden;display:inline-block;vertical-align:middle;margin-left:8px}
.minibar span{display:block;height:100%}
.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px}
.toolbar input[type=search]{max-width:280px}
.toolbar select{width:auto}

/* ---------- Queue ---------- */
.add-grid{display:grid;grid-template-columns:minmax(320px,460px) minmax(0,1fr);gap:18px;align-items:start}
.queue{list-style:none;margin:0;padding:0}
.q-item{display:grid;grid-template-columns:34px minmax(0,1fr) auto;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
.q-item:last-child{border-bottom:0}
.steps{display:flex;gap:4px;margin-top:7px}
.steps span{height:4px;flex:1;border-radius:2px;background:var(--surface-3)}
.steps span.on{background:var(--gold)}
.steps span.done{background:var(--sage)}
.steps span.err{background:var(--brand)}
.q-state{font-size:12.5px;color:var(--ink-2);margin-top:5px}

/* ---------- Job page ---------- */
.deal{background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);padding:20px 22px;margin-bottom:16px}
.deal-top{display:flex;flex-wrap:wrap;gap:14px 18px;align-items:center}
.deal .mono{width:52px;height:52px;flex-basis:52px;border-radius:12px;font-size:20px}
.deal-name{font:700 26px/1.1 var(--font-ui);font-stretch:92%;margin:0}
.deal-role{color:var(--ink-2);margin-top:3px;font-size:15px}
.deal-actions{margin-left:auto;display:flex;flex-wrap:wrap;gap:8px}
.deal-stats{display:grid;grid-template-columns:auto repeat(4,minmax(0,1fr));gap:16px;align-items:center;margin-top:18px;padding-top:16px;border-top:1px solid var(--line)}
.stat .k{font-size:12.5px;color:var(--ink-2)}
.stat .v{font:700 17px/1.2 var(--font-ui);margin-top:3px}
.stat .s{font-size:12.5px;color:var(--ink-3);margin-top:2px}
.ring text{font-family:var(--font-ui)}
.tl{margin-top:16px}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin:4px 0 16px;overflow-x:auto}
.tab{border:0;background:transparent;padding:10px 12px;font:650 14px/1 var(--font-ui);color:var(--ink-2);border-bottom:2px solid transparent;cursor:pointer;white-space:nowrap}
.tab:hover{color:var(--ink)}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--brand)}
.tab .n{margin-left:5px;font-size:12px;color:var(--ink-3)}
.prose{font:16px/1.65 var(--font-doc);max-width:70ch;margin:0}
.list{margin:0;padding-left:19px}
.list li{margin:0 0 5px}
.kv{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.kv .cell{background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.kv .k{font-size:12.5px;color:var(--ink-2)}
.kv .v{font-weight:700;margin-top:3px}
.kv .src{font-size:12px;margin-top:4px;display:inline-block}
.news{list-style:none;margin:0;padding:0}
.news li{padding:10px 0;border-bottom:1px solid var(--line)}
.news li:last-child{border-bottom:0}
.news a{font-weight:650;text-decoration:none}
.news a:hover{text-decoration:underline}
.sources{font-size:12.5px;color:var(--ink-3);margin-top:10px}
.sources a{color:var(--ink-2)}
.wc{font-size:12.5px;color:var(--ink-3)}
.wc.over{color:var(--brand-ink);font-weight:700}
.callout{border-left:3px solid var(--gold);background:var(--gold-wash);color:var(--ink);padding:10px 12px;border-radius:0 9px 9px 0;margin:10px 0}
.callout.bad{border-left-color:var(--brand);background:var(--brand-wash)}
.callout.ok{border-left-color:var(--sage);background:var(--sage-wash)}
.thought{margin-top:12px;padding:12px;border:1px dashed var(--line-strong);border-radius:12px;background:var(--surface-2)}
.qa + .qa{margin-top:22px;padding-top:18px;border-top:1px solid var(--line)}
.q-title{font:700 15.5px/1.35 var(--font-ui);margin:0 0 8px}
.log{list-style:none;margin:0 0 14px;padding:0}
.log li{border-left:3px solid var(--line-strong);padding:2px 0 12px 14px;margin-bottom:12px}
.log .date{font-size:12.5px;color:var(--ink-3);font-weight:650}
.log .you{margin:4px 0 8px;white-space:pre-wrap;font:15.5px/1.55 var(--font-doc)}
.log .ai{background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.log .ai p{margin:0 0 8px}
.k{font-weight:700}
.progress{font-size:13.5px;color:var(--ink-2);display:flex;align-items:center;gap:8px}
.spin{width:14px;height:14px;border:2px solid var(--line-strong);border-top-color:var(--brand);border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.err{border-left:3px solid var(--brand);background:var(--brand-wash);padding:9px 12px;border-radius:0 9px 9px 0;margin:10px 0}


/* ---------- Pictures ---------- */
.art svg{display:block;width:100%;height:auto}
.art.sm{width:120px;margin-bottom:10px}
.hero{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(260px,.8fr);gap:24px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:26px 28px;margin-bottom:18px;overflow:hidden}
.hero-title{font:750 34px/1.08 var(--font-ui);font-stretch:88%;letter-spacing:-.01em;margin:0}
.hero-sub{font:17px/1.6 var(--font-doc);color:var(--ink-2);margin:10px 0 0;max-width:52ch}
.hero-art{max-width:420px;justify-self:end;width:100%}
.cover{position:relative;height:150px;overflow:hidden;background:var(--sky-wash)}
.cover img{width:100%;height:100%;object-fit:cover;display:block}
.cover-art{height:150px;overflow:hidden}
.cover-art svg{width:100%;height:100%;display:block}
.credit{position:absolute;right:10px;bottom:8px;font-size:11.5px;color:#fff;background:rgba(0,0,0,.45);padding:3px 7px;border-radius:6px;text-decoration:none}
.deal.has-cover{padding:0;overflow:hidden}
.deal-body{padding:0 22px 20px}
.deal-logo{margin-top:-30px;padding:4px;background:var(--surface);border-radius:15px;box-shadow:var(--shadow);align-self:flex-start}
.deal-logo .mono{margin:0}
.deal.has-cover .deal-top{padding-top:0}
.deal.has-cover .deal-top > div:nth-child(2){padding-top:12px}
.deal.has-cover .deal-actions{padding-top:12px}
.logo-img{width:34px;height:34px;flex:0 0 34px;border-radius:9px;background:#fff;border:1px solid var(--line);display:grid;place-items:center;overflow:hidden}
.logo-img img{width:78%;height:78%;object-fit:contain}
.logo-img.big{width:52px;height:52px;flex-basis:52px;border-radius:12px}
.glance{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px;margin:0 0 16px}
.glance.four{grid-template-columns:repeat(4,minmax(0,1fr))}
.glance.three{grid-template-columns:repeat(3,minmax(0,1fr))}
.glance-tile{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.panel .glance-tile{background:var(--surface-2)}
.glance-tile .v{font:750 26px/1 var(--font-ui);font-stretch:82%;letter-spacing:-.01em}
.glance-tile .l{font-weight:650;font-size:13.5px;margin-top:6px}
.glance-tile .s{font-size:12.5px;color:var(--ink-3);margin-top:3px}
.glance-tile.accent{border-color:var(--gold);box-shadow:inset 0 3px 0 var(--gold)}
.glance-tile.ok{border-color:var(--sage);box-shadow:inset 0 3px 0 var(--sage)}
.glance-tile.ok .v{color:var(--sage-ink)}
.glance-tile.bad{border-color:var(--brand);box-shadow:inset 0 3px 0 var(--brand)}
.glance-tile.bad .v{color:var(--brand-ink)}
.city-hero{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,.9fr);background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden;margin-bottom:16px}
.city-hero .cover,.city-hero .cover-art{height:100%;min-height:220px}
.city-copy{padding:20px 22px}
.city-name{font:750 26px/1.1 var(--font-ui);font-stretch:90%;margin:0 0 8px}
.city-copy p{font:15.5px/1.6 var(--font-doc);margin:0 0 8px}
.budget-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:4px 12px}
@media (max-width:1100px){ .glance{grid-template-columns:repeat(3,minmax(0,1fr))} .budget-grid{grid-template-columns:repeat(2,minmax(0,1fr))} }
@media (max-width:900px){ .hero,.city-hero{grid-template-columns:1fr} .hero-art{justify-self:start;max-width:360px} .glance,.glance.four,.glance.three{grid-template-columns:1fr 1fr} }


/* ---------- Next steps, office, housing, hiring ---------- */
.steps-panel{margin-top:0}
.meter-line{height:6px;border-radius:3px;background:var(--surface-3);overflow:hidden;margin:-4px 0 12px}
.meter-line span{display:block;height:100%;background:var(--sage)}
.checklist{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:2px 18px}
.checklist li{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}
.checklist input{width:18px;height:18px;accent-color:var(--sage);flex:0 0 18px}
.checklist label{flex:1;font-weight:600}
.checklist li.done label{color:var(--ink-3);text-decoration:line-through}
.office-grid{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:18px;align-items:start}
.map{position:relative;display:block;border-radius:12px;overflow:hidden;border:1px solid var(--line);aspect-ratio:16/8;background:var(--surface-3)}
.map iframe{width:100%;height:100%;border:0;display:block}
.map-art svg{width:100%;height:100%;display:block}
.site-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.site{display:block;padding:12px 14px;border:1px solid var(--line);border-radius:10px;background:var(--surface-2);color:var(--ink);text-decoration:none}
.site:hover{border-color:var(--ink-3)}
.table.flat{border-radius:10px}
.table.flat tbody tr{cursor:default}
.table tr.picked td{background:var(--sage-wash)}
.process{list-style:none;margin:0;padding:0;counter-reset:step}
.process li{counter-increment:step;display:flex;gap:12px;align-items:flex-start;padding:8px 0}
.process li::before{content:counter(step);flex:0 0 28px;height:28px;border-radius:50%;background:var(--brand);color:var(--on-brand);display:grid;place-items:center;font-weight:800;font-size:13px}
.process li span{padding-top:4px}
@media (max-width:900px){ .checklist,.office-grid,.site-grid{grid-template-columns:1fr} }

/* Contacts */
.people-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.person{border:1px solid var(--line);border-radius:12px;padding:14px;background:var(--surface-2)}
.person.chosen{border-color:var(--sage);box-shadow:inset 0 3px 0 var(--sage)}
.person-top{display:flex;gap:10px;align-items:center}
.person-top .chip{margin-left:auto}
.email-line{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:8px}
@media (max-width:900px){ .people-grid{grid-template-columns:1fr} }

/* Practice questions */
.practice{border-top:1px solid var(--line);padding:4px 0}
.practice summary{display:flex;justify-content:space-between;gap:10px;align-items:center;cursor:pointer;padding:10px 0;font-weight:700;font-size:15px;list-style:none}
.practice summary::-webkit-details-marker{display:none}
.practice summary::after{content:"+";font-weight:700;color:var(--ink-3);font-size:18px}
.practice[open] summary::after{content:"–"}
.practice .qa{margin:0;padding:0 0 12px;border:0}
.practice .q-title{display:none}


/* ---------- Rule of four ---------- */
.four{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;align-items:start}
.four > .panel{margin:0}
.four > .panel:first-child:nth-last-child(1){grid-column:1 / -1}
.deal.slim .cover,.deal.slim .cover-art{height:96px}
.deal-stats.four-stats{grid-template-columns:auto repeat(3,minmax(0,1fr))}
details.more{margin-top:12px}
details.more > summary{cursor:pointer;font-weight:650;font-size:13.5px;color:var(--ink-2);list-style:none;display:inline-flex;align-items:center;gap:6px}
details.more > summary::-webkit-details-marker{display:none}
details.more > summary::before{content:"+";display:inline-grid;place-items:center;width:18px;height:18px;border-radius:50%;background:var(--surface-3);color:var(--ink);font-weight:800;font-size:13px}
details.more[open] > summary::before{content:"–"}
details.more > summary:hover{color:var(--ink)}
.slim-hero{padding:22px 26px}
.slim-hero .hero-art{max-width:300px}
.do-next{list-style:none;margin:0;padding:0}
.do-next li + li{border-top:1px solid var(--line)}
.do-btn{display:flex;align-items:center;gap:12px;width:100%;padding:12px 4px;border:0;background:transparent;color:var(--ink);font:600 15px/1.3 var(--font-ui);text-align:left;cursor:pointer}
.do-btn > span:nth-child(2){flex:1}
.do-btn:hover{background:var(--surface-2)}
.kpis.four-k{grid-template-columns:repeat(4,minmax(0,1fr));margin:16px 0}
.datelist{list-style:none;margin:0;padding:0;position:relative}
.datelist li{display:grid;grid-template-columns:18px 1fr auto auto;gap:10px;align-items:center;padding:7px 0;position:relative}
.datelist li:not(:last-child)::after{content:"";position:absolute;left:5px;top:22px;bottom:-8px;width:2px;background:var(--line)}
.dl-dot{width:12px;height:12px;border-radius:50%;background:var(--ink-3);z-index:1}
.dl-today .dl-dot{background:var(--surface);border:2.5px solid var(--ink)}
.dl-deadline .dl-dot{background:var(--brand)}
.dl-start .dl-dot,.dl-end .dl-dot{background:var(--sage)}
.dl-applied .dl-dot{background:var(--sky)}
.dl-label{font-weight:650}
.dl-date{font-weight:700;text-align:right}
.dl-rel{font-size:12.5px;color:var(--ink-3);min-width:84px;text-align:right}
.dl-deadline .dl-rel{color:var(--brand-ink);font-weight:700}
.kpi .s{font-size:12.5px;color:var(--ink-3);margin-top:3px}
.glance.two{grid-template-columns:repeat(2,minmax(0,1fr))}
.checklist.one{grid-template-columns:1fr}
.office-line{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:8px;margin-bottom:10px}
.log-entry{border-left:3px solid var(--line-strong);padding:2px 0 4px 12px;margin-top:14px}
.log-entry .you{margin:4px 0 8px;white-space:pre-wrap;font:15px/1.55 var(--font-doc)}
.qpause{margin-top:8px;color:var(--gold);font-weight:650}
.due-text{color:var(--brand-ink);font-weight:700}
.main{max-width:1280px}
@media (max-width:1000px){ .four{grid-template-columns:1fr} .deal-stats.four-stats{grid-template-columns:1fr 1fr} .kpis.four-k{grid-template-columns:1fr 1fr} }


/* ---------- Job page as a short presentation ---------- */
.big-stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-top:16px;padding-top:16px;border-top:1px solid var(--line)}
.big-stat{display:flex;align-items:center;gap:12px;background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:12px 14px;min-height:82px}
.big-stat .v{font:800 26px/1.05 var(--font-ui);font-stretch:82%;letter-spacing:-.01em}
.big-stat .l{font-size:13px;color:var(--ink-2);margin-top:3px}
.big-stat.urgent{border-color:var(--brand);box-shadow:inset 0 3px 0 var(--brand)}
.big-stat.urgent .v{color:var(--brand-ink)}
.todo{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:18px 20px;margin:16px 0}
.todo-head{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.todo-head h2{font:750 20px/1.2 var(--font-ui);margin:0 0 10px}
.todo-count{font:750 15px/1 var(--font-ui);color:var(--sage-ink);background:var(--sage-wash);padding:6px 10px;border-radius:999px}
.checklist.two-col{grid-template-columns:repeat(2,minmax(0,1fr))}
.checklist li{cursor:pointer}
.checklist label{cursor:pointer}
.jump{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 16px;position:sticky;top:0;z-index:8;background:var(--bg);padding:8px 0}
.jump-chip{display:inline-flex;align-items:center;gap:8px;padding:7px 12px 7px 8px;border-radius:999px;background:var(--surface);border:1px solid var(--line);color:var(--ink);text-decoration:none;font-weight:650;font-size:13.5px}
.jump-chip:hover{border-color:var(--ink-3)}
.jump-chip .n,.slide .n{display:inline-grid;place-items:center;width:24px;height:24px;border-radius:50%;background:var(--brand);color:var(--on-brand);font:800 12.5px/1 var(--font-ui);flex:0 0 24px}
.jump-chip.done{color:var(--ink-3)}
.jump-chip.done .n,.slide .n.ok{background:var(--sage)}
.slide{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:22px 24px;margin:0 0 16px;scroll-margin-top:64px}
.slide-head{display:flex;align-items:flex-start;gap:14px;margin-bottom:16px}
.slide-head .n{width:32px;height:32px;flex-basis:32px;font-size:15px}
.slide-head h2{font:750 22px/1.15 var(--font-ui);font-stretch:92%;margin:2px 0 2px}
.slide-head p{margin:0;color:var(--ink-2);font-size:14.5px}
.slide-head .btn{margin-left:auto}
.slide.done{display:flex;align-items:center;gap:12px;padding:12px 18px;background:var(--surface-2)}
.slide.done .btn{margin-left:auto}
.lead{font:19px/1.55 var(--font-doc);margin:0 0 14px;max-width:62ch}
/* Documents */
.doc-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(360px,1fr));gap:16px}
.doc-card{border:1px solid var(--line);border-radius:14px;padding:16px;background:var(--surface-2);display:flex;flex-direction:column;gap:10px}
.doc-card.ready{display:grid;grid-template-columns:170px minmax(0,1fr);gap:18px;align-items:start}
.doc-card.upload{flex-direction:row;align-items:center;gap:14px}
.doc-icon{width:46px;height:56px;border-radius:6px;background:var(--surface);border:1px solid var(--line-strong);display:grid;place-items:center;font:800 18px/1 var(--font-ui);color:var(--ink-3)}
.doc-title{font:750 18px/1.2 var(--font-ui)}
.doc-actions{display:flex;flex-wrap:wrap;gap:8px}
.paper{position:relative;width:170px;height:220px;background:#fff;color:#222;border-radius:4px;box-shadow:0 1px 3px rgba(0,0,0,.12),0 8px 22px rgba(20,33,43,.10);padding:14px 13px;overflow:hidden}
.paper p{margin:0 0 5px;font:5.6px/1.45 "Times New Roman",Times,serif;white-space:pre-wrap;color:#333}
.paper p.b{font-weight:700;font-size:8px;color:#111}
.paper .fade{position:absolute;left:0;right:0;bottom:0;height:60px;background:linear-gradient(rgba(255,255,255,0),#fff)}
.short-answers{margin-top:18px}
/* Contact */
.contact-grid{display:grid;grid-template-columns:minmax(260px,.8fr) minmax(0,1.2fr);gap:18px;align-items:start}
.who{display:flex;flex-direction:column;gap:10px}
.who > .more{margin-top:0}
.who > .btn{align-self:flex-start}
/* Company */
.fact-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.fact{background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:14px}
.fact .v{font:800 20px/1.15 var(--font-ui);font-stretch:88%}
.fact .l{font-size:13px;color:var(--ink-2);margin-top:4px}
.fact .src{font-size:11.5px;color:var(--ink-3);display:inline-block;margin-top:6px}
.news-line{display:flex;gap:10px;align-items:center;margin-top:14px;font-weight:650}
.news-line a{text-decoration:none;color:var(--ink)}
.news-line a:hover{text-decoration:underline}
/* Interview */
.iv-grid{display:grid;grid-template-columns:220px minmax(0,1fr);gap:18px;align-items:center}
.iv-reply{background:var(--gold-wash);border-radius:14px;padding:18px}
.iv-reply .v{font:800 28px/1.05 var(--font-ui);font-stretch:82%}
.iv-reply .l{font-weight:650;margin-top:6px}
.iv-reply .s{font-size:12.5px;color:var(--ink-2);margin-top:4px}
.stepper{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;counter-reset:s}
.stepper li{position:relative;display:flex;flex-direction:column;gap:8px;font-size:13.5px;font-weight:600}
.stepper li:not(:last-child)::after{content:"";position:absolute;top:13px;left:30px;right:-6px;height:2px;background:var(--line-strong)}
.stepper .dot{flex:0 0 28px;align-self:flex-start;width:28px;height:28px;border-radius:50%;background:var(--brand);color:var(--on-brand);display:grid;place-items:center;font-weight:800;font-size:13px;z-index:1}
.iv-qs{margin-top:16px}
.q-list{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.q-list li{background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:10px 12px;font:15.5px/1.45 var(--font-doc)}
/* Summer */
.money-row{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-bottom:12px}
.summer-grid{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,.6fr);gap:18px;margin-top:14px}
.near{display:flex;flex-direction:column;gap:8px}
.hood{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:12px;align-items:center;text-align:left;width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface-2);color:var(--ink);cursor:pointer;font:inherit}
.hood:hover{border-color:var(--ink-3)}
.hood.on{border-color:var(--sage);background:var(--sage-wash)}
.hood .v{font:800 16px/1 var(--font-ui)}
.trip-v{font:800 24px/1.1 var(--font-ui);font-stretch:85%}
/* After you send */
.after-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.draft-card{border:1px solid var(--line);border-radius:12px;padding:14px;background:var(--surface-2);display:flex;flex-direction:column;gap:10px}
.draft-text{margin:0;font:15px/1.55 var(--font-doc);white-space:pre-wrap}
.plain{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:10px}
.changes{background:var(--surface);border:1px dashed var(--line-strong);border-radius:16px;padding:16px 20px;margin:0 0 16px}
.changes-head h2{font:750 18px/1.2 var(--font-ui);margin:0}
.changes-head p{margin:4px 0 10px;color:var(--ink-2);font-size:14px}
.fill{display:flex;align-items:center;gap:10px;margin:6px 0 12px}
.fill-bar{width:120px;height:8px;border-radius:4px;background:var(--surface-3);overflow:hidden;flex:0 0 120px}
.fill-bar span{display:block;height:100%;background:var(--sage)}
.fill-bar span.over{background:var(--brand)}
.dl-all{display:flex;flex-wrap:wrap;align-items:center;gap:12px;margin:-4px 0 16px;padding:12px 14px;border-radius:12px;background:var(--sage-wash)}
/* Print a single document as a clean page */
#print-root{display:none}
@media print{
  body.printing > *:not(#print-root){display:none !important}
  body.printing #print-root{display:block;font-family:"Times New Roman",Times,serif;color:#000;background:#fff}
  @page{margin:1in}
}
@media (max-width:1000px){
  .big-stats{grid-template-columns:1fr 1fr} .checklist.two-col{grid-template-columns:1fr} .contact-grid,.iv-grid,.summer-grid,.after-grid{grid-template-columns:1fr}
  .fact-grid{grid-template-columns:1fr 1fr} .stepper{grid-template-columns:1fr 1fr} .stepper li::after{display:none} .money-row{grid-template-columns:1fr}
  .doc-card.ready{grid-template-columns:1fr} .paper{width:150px;height:194px}
}

/* ---------- Charts ---------- */
.chart{width:100%;height:auto;display:block}
.chart text{font-family:var(--font-ui);fill:var(--ink-2);font-size:11px}
.chart .val{fill:var(--ink);font-weight:700}
.chart .grid{stroke:var(--line)}
.hb{display:grid;grid-template-columns:118px minmax(0,1fr) 38px;gap:8px 10px;align-items:center}
.hb .lab{font-size:13px;color:var(--ink-2)}
.hb .track{height:9px;background:var(--surface-3);border-radius:5px;overflow:hidden}
.hb .fill{height:100%;border-radius:5px}
.hb .num{font-weight:700;font-size:13px;text-align:right}
.legend{display:flex;flex-wrap:wrap;gap:12px;font-size:12.5px;color:var(--ink-2);margin-top:8px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}

.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(8px);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:9px;font-weight:650;font-size:14px;opacity:0;pointer-events:none;transition:opacity .18s,transform .18s;z-index:50}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}

@media (max-width:1100px){
  .kpis{grid-template-columns:repeat(3,minmax(0,1fr))}
  .deal-stats{grid-template-columns:auto repeat(2,minmax(0,1fr))}
}
@media (max-width:900px){
  .shell{grid-template-columns:1fr}
  .side{position:sticky;top:0;z-index:20;height:auto;flex-direction:row;align-items:center;gap:8px;padding:8px 10px;overflow-x:auto}
  .logo{padding:0 6px 0 0}
  .logo-name,.logo-sub,.side-foot{display:none}
  .nav{flex-direction:row}
  .nav-btn{padding:8px 10px}
  .nav-btn .lbl-t{display:none}
  .cols,.cols3,.add-grid,.grid2{grid-template-columns:1fr}
  .kpis{grid-template-columns:repeat(2,minmax(0,1fr))}
  .kv{grid-template-columns:1fr 1fr}
  .table .hide-sm{display:none}
}
@media (prefers-reduced-motion: reduce){ .spin{animation:none} .toast,.qbar span{transition:none} }

<script>

  AK.runIntel = function (a) {

  /* ---------- 10. Find a contact in the hiring office (web search) ---------- */
  function promptContact(a) {
    var k = a.kit || {}, site = a.website || k.website, school = S.profile.school || "the student's school";
    return [
      "TODAY: " + AK.todayISO(),
      "JOB:\n" + appBrief(a) + (k.address ? "\nOFFICE: " + k.address : ""),
      "STUDENT'S SCHOOL: " + school,
      "Use web search to find the people who would actually hire for this role, not senior executives. In order of priority:",
      "1. The hiring manager: whoever leads the team or group this role sits on (for example a VP, director or team lead), or the person the posting names as the contact.",
      "2. A recruiter or campus recruiter who handles this office, program or school.",
      "3. Alumni of " + school + " at this firm, ideally on this team or in this office, at an analyst to VP level.",
      "4. Analysts or associates on the team.",
      "Do not pick CEOs, presidents, C-suite executives, founders, managing partners, managing directors or board members, unless the firm has about 15 or fewer people (then the founders usually do the hiring) or the posting names them as the contact.",
      "Use only people who are publicly listed (company team pages, press releases, conference pages, university career pages, public LinkedIn pages). Never guess names.",
      "A person is: {\"name\":string,\"title\":string,\"office\":string,\"role_type\":\"Hiring manager\"|\"Recruiter\"|\"Alum\"|\"Team member\"|\"Founder (small firm)\",\"school\":their school if known else \"\",\"why\":10 words max,\"linkedin\":profile url or \"\",\"email\":only if publicly listed else \"\",\"source\":url}",
      "Return compact JSON: {\"team_size\":number of employees or null,\"best\":person or null,\"others\":[person] up to 2,\"alumni\":[person] up to 3,",
      "\"email_pattern\":{\"pattern\":like \"first.last@" + (site ? AK.domain(site) : "company.com") + "\",\"source\":url} or null if not found publicly,\"tip\":one short sentence on the best way to reach them}"
    ].join("\n\n");
  }
  var ROLE_RANK = { "Hiring manager": 0, "Recruiter": 1, "Alum": 2, "Team member": 3, "Founder (small firm)": 4 };
  AK.isSenior = function (title) { return /\b(chief|ceo|cfo|coo|cto|cio|president|founder|co-founder|managing (partner|director)|general partner|partner|board|chair(man|woman)?|vice chair|executive vice|evp|svp|head of)\b/i.test(AK.str(title)); };
  function schoolKey() { var s = AK.str(S.profile.school).toLowerCase().replace(/^the\s+/, ""); return s.replace(/university of |college|university/g, "").trim(); }
  AK.isAlum = function (p) { var key = schoolKey(); return !!p && (p.role_type === "Alum" || (key && AK.str(p.school).toLowerCase().indexOf(key) >= 0)); };
  function normPerson(p) {
    if (!p || !p.name) return null;
    var email = AK.str(p.email).trim();
    var rt = ROLE_RANK.hasOwnProperty(p.role_type) ? p.role_type : "Team member";
    return { name: String(p.name), title: AK.str(p.title), office: AK.str(p.office), role_type: rt, school: AK.str(p.school), why: AK.str(p.why), linkedin: AK.url(p.linkedin),
      email: /^[^@\s]+@[^@\s]+\.[a-z]{2,}$/i.test(email) ? email : "", source: AK.url(p.source) };
  }
  function normContact(r, sources) {
    r = r || {};
    var ep = r.email_pattern && AK.str(r.email_pattern.pattern).indexOf("@") > 0 ? { pattern: AK.str(r.email_pattern.pattern).toLowerCase(), source: AK.url(r.email_pattern.source) } : null;
    var size = AK.num(r.team_size, 1, 1000000);
    var all = [r.best].concat(AK.arr(r.others, 3)).concat(AK.arr(r.alumni, 3)).map(normPerson).filter(Boolean);
    var seen = {}; all = all.filter(function (p) { var key = p.name.toLowerCase(); if (seen[key]) return false; seen[key] = 1; return true; });
    var small = size !== null && size <= 15;
    // Rank: who actually hires first; senior executives last unless it's a small firm.
    var rank = function (p) { var s = ROLE_RANK[p.role_type] * 10 + (AK.isAlum(p) ? -3 : 0); if (AK.isSenior(p.title) && !small && p.role_type !== "Hiring manager") s += 100; return s; };
    all.sort(function (x, y) { return rank(x) - rank(y); });
    var best = all[0] || null;
    return { state: "done", updated: AK.todayISO(), team_size: size, small_firm: small, best: best, others: all.slice(1),
      email_pattern: ep, tip: AK.str(r.tip), sources: (sources || []).slice(0, 8) };
  }
  // Builds a likely address from a public pattern like first.last@firm.com. Always shown as unverified.
  AK.guessEmail = function (person, pattern) {
    if (!person || !pattern) return "";
    var parts = person.name.toLowerCase().replace(/[^a-z\s'-]/g, "").replace(/['-]/g, "").split(/\s+/).filter(Boolean);
    if (parts.length < 2) return "";
    var first = parts[0], last = parts[parts.length - 1];
    var at = pattern.indexOf("@"); if (at < 1) return "";
    var local = pattern.slice(0, at), domain = pattern.slice(at + 1);
    var out = local.replace(/firstname|first/g, "\u0001").replace(/lastname|last/g, "\u0002").replace(/\bf\b|^f(?=[._]?\u0002)/g, "\u0003").replace(/\bl\b|(?<=\u0001[._]?)l$/g, "\u0004");
    out = out.replace(/\u0001/g, first).replace(/\u0002/g, last).replace(/\u0003/g, first[0]).replace(/\u0004/g, last[0]);
    return /^[a-z0-9._-]+$/.test(out) && /\./.test(domain) ? out + "@" + domain : "";
  };
  AK.contactText = function (a) {
    var c = a.contact && a.contact.state === "done" ? (a.contact.chosen || a.contact.best) : null;
    if (AK.str(a.contactText).trim()) return a.contactText;
    return c ? c.name + ", " + c.title + (c.office ? " (" + c.office + ")" : "") + ". " + c.why + (AK.isAlum(c) ? " Also an alum of the student's school" + (c.school ? " (" + c.school + ")" : "") + "." : "") : "";
  };
  AK.applyContact = function (a, person) {

    if (guess) { a.kit.email.to = guess; a.kit.email.to_verified = !!person.email; }
  };
  AK.runContact = function (a) {
    a.contact = { state: "running" }; AK.onChange(a.id);
    return AK.ask({ system: AK.SYSTEM, user: promptContact(a), maxTokens: 1600, search: true, maxSearches: 3 })
      .then(function (r) {
        a.contact = normContact(r, r.__sources);

      })

      .then(function () { AK.saveApps(); AK.onChange(a.id); });
  };
  AK.rewriteOutreachFor = function (a) {
    return AK.ask({ system: AK.SYSTEM, user: promptOutreach(a), maxTokens: 1400 }).then(function (r) { applyOutreach(a, normOutreach(r)); });
  };

  /* ---------- 11. Documents: cover letter and personal statement ---------- */
  AK.WRITABLE = { "Cover letter": 1, "Personal statement": 1, "Other": 1 };
  function researchBrief(a) {
    var r = a.research && a.research.state === "done" ? a.research : null, it = a.intel && a.intel.state === "done" ? a.intel : null;
    return JSON.stringify({ what_they_do: r && r.what_they_do, facts: r && r.facts.slice(0, 4), news: r && r.news.slice(0, 2), talking_points: r && r.talking_points,
      values: it && it.values, stand_out: it && it.stand_out });
  }
  // Measured in Word-equivalent layout: 12 pt Times New Roman, single spaced, 1-inch margins.
  AK.PAGE_WORDS = { "Cover letter": 450, "Personal statement": 675, "Other": 675 };
  AK.TARGET = { "Cover letter": [320, 400], "Personal statement": [580, 640], "Other": [580, 640] };
  function docBase(a, d, note) {
    return ["TODAY: " + AK.todayISO(), "PROFILE:\n" + profileBlock(), "JOB:\n" + appBrief(a), "COMPANY RESEARCH:\n" + researchBrief(a),
      d.requirement ? "REQUIREMENT FROM THE POSTING: " + d.requirement : "", d.prompt ? "PROMPT FROM THE POSTING: " + d.prompt : "",
      suggestionsBlock(a),
      note ? "THE STUDENT'S DIRECTION FOR THIS DRAFT: " + note : ""];
  }
  var VOICE = "Write the way a thoughtful college student talks, with plain everyday words, honest about still learning, no finance jargon and nothing invented. Use only experiences in PROFILE. Never use em dashes, en dashes, colons or semicolons, only commas and periods. The title has no colon either.";
  function promptCover(a, d, note) {
    var c = a.contact && a.contact.state === "done" ? (a.contact.chosen || a.contact.best) : null;
    return docBase(a, d, note).concat([
      c ? "ADDRESS IT TO: " + c.name + ", " + c.title : "",
      "Write a one-page cover letter in US business-letter style. The body must be 320 to 400 words across four paragraphs (it fills one page in 12-point Times New Roman):",
      "1. The role, and one specific, true reason for this firm drawn from the company research (not flattery).",
      "2. A concrete example from the student's real experience, tied to what the firm values.",
      "3. A second real example, and what it taught them that they'd bring this summer.",
      "4. A short, confident close asking for a conversation.",
      "Sound like a capable college student who is excited to learn. No clichés, no line-by-line resume recap.", VOICE,
      "Return JSON {\"recipient\":{\"name\":string or \"\",\"title\":string or \"\",\"company\":string,\"address\":office address if known or \"\"},\"salutation\":string,\"paragraphs\":[string],\"closing\":\"Sincerely,\"}"
    ]).filter(Boolean).join("\n\n");
  }
  // Long statements are written in two halves so nothing gets cut off and the page ends up full.
  function promptStatementA(a, d, note) {
    return docBase(a, d, note).concat([
      "You're writing a one-page " + (d.type === "Other" ? "statement" : "personal statement") + " of about 600 words in five paragraphs. Write only the FIRST THREE paragraphs now, 340 to 380 words in total.",
      "One clear theme. Paragraph 1 opens with a specific real moment. Paragraphs 2 and 3 show what the student did, what was hard, and what they learned, with concrete details. If the posting gives a prompt, build toward answering it.", VOICE,
      "Return JSON {\"title\":short title or \"\",\"theme\":one sentence,\"paragraphs\":[three strings]}"
    ]).filter(Boolean).join("\n\n");
  }
  function promptStatementB(a, d, note, first) {
    return docBase(a, d, note).concat([
      "Here are the first three paragraphs of a one-page personal statement:\n\"\"\"\n" + first.join("\n\n") + "\n\"\"\"",
      "Write the LAST TWO paragraphs, 230 to 270 words in total, so the whole statement reads as one piece. Paragraph 4 connects what they learned to this field and this firm specifically. Paragraph 5 closes looking forward to the summer, without repeating earlier lines.", VOICE,
      "Return JSON {\"paragraphs\":[two strings],\"gaps\":one short sentence on what real detail would make it stronger, or \"\"}"
    ]).filter(Boolean).join("\n\n");
  }
  function promptGrow(a, d, paras, need) {
    return docBase(a, d, "").concat([
      "This " + d.type.toLowerCase() + " is " + need + " words too short to fill its page:\n\"\"\"\n" + paras.join("\n\n") + "\n\"\"\"",
      "Write ONE new paragraph of about " + Math.max(70, Math.min(150, need + 20)) + " words that belongs right before the final paragraph. Add a real detail from PROFILE that isn't used yet, so it adds substance rather than filler.", VOICE,
      "Return JSON {\"paragraph\":string}"
    ]).filter(Boolean).join("\n\n");
  }
  function promptTrim(a, d, para, cut) {
    return ["Shorten this paragraph by about " + cut + " words without losing its main point or any real detail:\n\"\"\"\n" + para + "\n\"\"\"", VOICE, "Return JSON {\"paragraph\":string}"].join("\n\n");
  }
  AK.ensureDocs = function (a) {
    var k = a.kit; if (!k) return [];
    a.docs = a.docs || [];
    (k.documents || []).forEach(function (d) {
      if (!a.docs.some(function (x) { return x.type === d.type; })) a.docs.push({ type: d.type, requirement: d.requirement, prompt: d.prompt, state: AK.WRITABLE[d.type] ? "" : "upload" });
    });
    return a.docs;
  };
  function countWords(paras) { return paras.join(" ").split(/\s+/).filter(Boolean).length; }
  AK.runDoc = function (a, d, note) {
    if (!AK.WRITABLE[d.type]) return Promise.resolve();

    var target = AK.TARGET[d.type] || AK.TARGET.Other;
    var clean = function (arr) { return AK.arr(arr, 8).map(String).map(function (p) { return AK.studentText(p.trim()); }).filter(Boolean); };

        })
      : AK.ask({ system: AK.SYSTEM, user: promptStatementA(a, d, note), maxTokens: 1400 }).then(function (r1) {
          var first = clean(r1.paragraphs); d.title = AK.studentText(AK.str(r1.title)).replace(/\.$/, "");
